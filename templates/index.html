<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Troca de Fardamento</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 900px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .actions { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .flex-container { display: flex; gap: 20px; }
        .flex-item { flex: 1; border: 1px solid #eee; padding: 10px; border-radius: 5px; }
        h3 { margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registro de Troca de Fardamento</h1>

        <form id="exchangeForm">
            <div class="form-group">
                <label for="student_id">Matrícula do Aluno</label>
                <input type="text" id="student_id" required>
            </div>

            <div class="flex-container">
                <div class="flex-item">
                    <h3>Fardamento que ENTROU</h3>
                    <div class="form-group">
                        <label for="in_uniform_code">Código</label>
                        <input type="text" id="in_uniform_code" list="uniform_codes" required>
                    </div>
                    <div class="form-group">
                        <label for="in_uniform_size">Tamanho</label>
                        <input type="text" id="in_uniform_size" list="uniform_sizes" required>
                    </div>
                </div>

                <div class="flex-item">
                    <h3>Fardamento que SAIU</h3>
                    <div class="form-group">
                        <label for="out_uniform_code">Código</label>
                        <input type="text" id="out_uniform_code" list="uniform_codes" required>
                    </div>
                    <div class="form-group">
                        <label for="out_uniform_size">Tamanho</label>
                        <input type="text" id="out_uniform_size" list="uniform_sizes" required>
                    </div>
                </div>
            </div>

            <datalist id="uniform_codes"></datalist>
            <datalist id="uniform_sizes"></datalist>

            <button type="submit" style="margin-top: 15px; width: 100%;">Registrar Troca</button>
        </form>

        <div class="actions">
            <h2>Ações</h2>
            <div class="form-group">
                <label for="importFile">Importar Fardamentos (CSV: code,size)</label>
                <input type="file" id="importFile" accept=".csv">
                <button onclick="importUniforms()" style="margin-top: 5px;">Importar</button>
            </div>
            <button onclick="exportPDF()" style="background-color: #28a745;">Exportar Histórico em PDF</button>
        </div>

        <h2>Histórico de Trocas</h2>
        <table id="historyTable">
            <thead>
                <tr>
                    <th>Matrícula</th>
                    <th>Entrou (C/T)</th>
                    <th>Saiu (C/T)</th>
                    <th>Data/Hora</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById('exchangeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const student_id = document.getElementById('student_id').value;
            const in_uniform_code = document.getElementById('in_uniform_code').value;
            const in_uniform_size = document.getElementById('in_uniform_size').value;
            const out_uniform_code = document.getElementById('out_uniform_code').value;
            const out_uniform_size = document.getElementById('out_uniform_size').value;

            const response = await fetch('/register_exchange', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id,
                    in_uniform_code, in_uniform_size,
                    out_uniform_code, out_uniform_size
                })
            });

            if (response.ok) {
                alert('Troca registrada com sucesso!');
                loadHistory();
                e.target.reset();
            } else {
                alert('Erro ao registrar troca.');
            }
        });

        async function loadUniforms() {
            const response = await fetch('/uniforms');
            const data = await response.json();
            const codesList = document.getElementById('uniform_codes');
            const sizesList = document.getElementById('uniform_sizes');

            codesList.innerHTML = '';
            sizesList.innerHTML = '';

            const codes = new Set();
            const sizes = new Set();

            data.forEach(u => {
                codes.add(u.code);
                sizes.add(u.size);
            });

            codes.forEach(code => {
                codesList.insertAdjacentHTML('beforeend', `<option value="${code}">`);
            });
            sizes.forEach(size => {
                sizesList.insertAdjacentHTML('beforeend', `<option value="${size}">`);
            });
        }

        async function loadHistory() {
            const response = await fetch('/history');
            const data = await response.json();
            const tbody = document.querySelector('#historyTable tbody');
            tbody.innerHTML = '';
            data.forEach(item => {
                const row = `<tr>
                    <td>${item.student_id}</td>
                    <td>${item.in_uniform_code} / ${item.in_uniform_size}</td>
                    <td>${item.out_uniform_code} / ${item.out_uniform_size}</td>
                    <td>${new Date(item.timestamp).toLocaleString()}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        async function importUniforms() {
            const fileInput = document.getElementById('importFile');
            if (fileInput.files.length === 0) {
                alert('Selecione um arquivo primeiro.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const response = await fetch('/import_uniforms', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.json();
                alert(result.message);
                fileInput.value = '';
                loadUniforms();
            } else {
                alert('Erro ao importar fardamentos.');
            }
        }

        function exportPDF() {
            window.location.href = '/export_pdf';
        }

        // Initial load
        loadUniforms();
        loadHistory();
    </script>
</body>
</html>
